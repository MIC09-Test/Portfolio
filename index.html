<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Portfolio of Michael Lim" />
    <meta name="color-scheme" content="dark" />
    <title>Michael Lim — Portfolio</title>
  </head>
  <body>
    <div id="world">
      <main id="app"></main>
    </div>

    <!-- Platforms render behind the text, the explorer in front of it,
         and the darkness above everything. All ignore the pointer. -->
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="actor" aria-hidden="true"></canvas>
    <canvas id="light" aria-hidden="true"></canvas>

    <!-- The lights switch is not here: it lives in the page, beside his
         name, because in the cave it has to be somewhere he can reach. -->
    <div id="hint">
      ← → walk &nbsp;·&nbsp; ↑ jump &nbsp;·&nbsp; ↓ descend &nbsp;·&nbsp; esc for lights
    </div>

    <div id="touch-controls">
      <div class="tc-group">
        <button id="btn-left" aria-label="Walk left">◀</button>
        <button id="btn-right" aria-label="Walk right">▶</button>
      </div>
      <div class="tc-group">
        <button id="btn-down" aria-label="Descend">▼</button>
        <button id="btn-jump" aria-label="Jump">▲</button>
      </div>
    </div>

    <!-- A phone has no Esc key, so the lifeline needs a button of its own, or
         a visitor who taps the switch out of curiosity is stuck in a dark
         room with a platformer they did not ask for. Far corner from the
         thumb pad, so it is never caught mid-jump. -->
    <button id="btn-lights" type="button" aria-label="Turn the lights back on">
      ☀
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
